<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>星海电台</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --fg:#dde7f2; --dim:#8ba0b8; --line:#35536e; --bg:#0d1522 }
  html,body { margin:0; height:100dvh; overflow:hidden; background:#04060d;
              color:var(--fg); font-family:system-ui,sans-serif; overscroll-behavior:none }
  #c { position:fixed; inset:0; display:block; cursor:grab; touch-action:none }
  button { font-family:inherit }

  /* 顶栏 */
  #top { position:fixed; top:0; left:0; right:0; display:flex; align-items:center;
         gap:8px; padding:10px 12px; z-index:3; pointer-events:none }
  #brand { font-weight:700; letter-spacing:.15em; font-size:.95rem; color:#cfe0f0;
           text-shadow:0 0 10px #0006 }
  #top .sp { flex:1 }
  #top button, #panelBtn { pointer-events:auto; background:#0d1522cc; color:var(--fg);
         border:1px solid var(--line); border-radius:9px; padding:.42em .7em;
         font-size:.85rem; cursor:pointer }
  #top button:hover { background:#182438dd }

  /* 筛选 */
  #filters { position:fixed; top:52px; left:50%; transform:translateX(-50%);
             display:flex; gap:6px; z-index:2; flex-wrap:wrap; justify-content:center; max-width:96vw }
  #filters select { background:#0d1522cc; color:#cde; border:1px solid var(--line);
                    border-radius:8px; padding:.32em .5em; font-size:.85rem; cursor:pointer; max-width:30vw }

  /* 底部播放卡 */
  #ui { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);
        text-align:center; pointer-events:none; z-index:2 }
  #name { font-size:1.35rem; margin:.15em 0; text-shadow:0 0 12px #000 }
  #meta { color:var(--dim); min-height:1.5em; font-size:.9rem }
  #acts { pointer-events:auto; display:flex; gap:7px; justify-content:center; margin-top:.6em }
  .btn { font-size:1.05rem; padding:.45em .95em; cursor:pointer; border-radius:11px;
         border:1px solid var(--line); background:#0d1522cc; color:var(--fg) }
  .btn.pri { font-size:1.35rem; padding:.45em 1.5em }
  .btn:hover { background:#182438dd }
  .btn.on { color:#ffb37a; border-color:#7a5535 }
  #sleepTag { color:#ffb37a; font-size:.8rem; min-height:1.2em; margin-top:.4em }

  /* 唱片模式条:返回/形态切换/上下台 */
  #diveBar { position:fixed; left:50%; transform:translateX(-50%);
             bottom:calc(env(safe-area-inset-bottom,0px) + 3vh); z-index:4;
             display:none; gap:6px; align-items:center;
             background:#0d1522dd; border:1px solid var(--line); border-radius:12px;
             padding:6px 10px }
  #diveBar.open { display:flex }
  #diveBar .btn { font-size:.85rem; padding:.35em .7em }

  /* 侧面板:历史/收藏/睡眠 */
  #panel { position:fixed; top:0; right:0; bottom:0; width:min(340px,88vw); z-index:5;
           background:#070d18f2; border-left:1px solid var(--line); padding:16px;
           overflow-y:auto; transform:translateX(105%); transition:transform .25s }
  #panel.open { transform:none }
  #panel h3 { margin:.6em 0 .35em; font-size:.85rem; color:var(--dim); font-weight:600 }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px }
  #panel .chips button { background:#0d1522; color:#bcd; border:1px solid #2b4258;
           border-radius:99px; padding:.28em .75em; font-size:.8rem; cursor:pointer; max-width:100%;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  #panel .chips button:hover { background:#182438 }
  #panel .row { display:flex; gap:6px; align-items:center; margin:.4em 0; font-size:.85rem }
  #panel .row .sp { flex:1 }
  .sw { position:relative; width:34px; height:19px; border-radius:99px; border:1px solid var(--line);
        background:#0d1522; cursor:pointer; flex:0 0 auto }
  .sw::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px;
               border-radius:50%; background:#8ba0b8; transition:.15s }
  .sw.on { background:#2a4a68 } .sw.on::after { left:17px; background:#ffb37a }
  #panelClose { position:absolute; top:10px; right:10px; background:none; border:none;
                color:var(--dim); font-size:1.1rem; cursor:pointer }
  .empty { color:#57708c; font-size:.8rem }

  /* 搜索 */
  #search { position:fixed; inset:0; z-index:6; background:#04060dcc; display:none;
            padding-top:12vh; backdrop-filter:blur(3px) }
  #search.open { display:block }
  #searchBox { width:min(560px,92vw); margin:0 auto; background:#0b1424;
               border:1px solid var(--line); border-radius:14px; overflow:hidden }
  #searchInput { width:100%; box-sizing:border-box; background:none; border:none;
                 outline:none; color:var(--fg); font-size:1.05rem; padding:.9em 1em }
  #searchList { max-height:52vh; overflow-y:auto }
  #searchList button { display:block; width:100%; text-align:left; background:none;
       border:none; border-top:1px solid #16283c; color:var(--fg); padding:.6em 1em;
       cursor:pointer; font-size:.92rem }
  #searchList button:hover { background:#14213a }
  #searchList .s { color:var(--dim); font-size:.78rem }

  /* 快捷键提示 */
  #hints { position:fixed; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
           z-index:1; color:#44608a; font-size:.72rem; line-height:1.7; text-align:right;
           user-select:none; pointer-events:none }
  #hints b { color:#6e8db8; font-weight:600 }

  #credit { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 2px);
            text-align:center; z-index:0 }
  #credit a { color:#3d5573; font-size:.68rem; text-decoration:none }
  #credit a:hover { color:#57708c }

  /* 星云流派标签(SVG overlay,随簇心投影移动) */
  #nebLabels { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none }
  #nebLabels text.big { font-size:.95rem; font-weight:600; letter-spacing:.06em;
                        text-shadow:0 0 6px #000c }
  #nebLabels text.s { font-size:.7rem; fill:#8ba0b8; text-shadow:0 0 6px #000c }

  /* 手机 */
  @media (max-width:600px) {
    #brand { font-size:.8rem }
    #top { padding:8px }
    #top button { padding:.4em .55em; font-size:.78rem }
    #filters { top:48px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:0 8px }
    #filters select { max-width:44vw; flex:0 0 auto }
    #ui { bottom:calc(env(safe-area-inset-bottom,0px) + 12vh) }
    #name { font-size:1.05rem; display:-webkit-box; -webkit-line-clamp:2;
            -webkit-box-orient:vertical; overflow:hidden; max-width:92vw; margin-inline:auto }
    #acts { flex-wrap:wrap; gap:6px }
    .btn { padding:.42em .8em; font-size:.95rem; min-height:40px }
    .btn.pri { font-size:1.1rem; padding:.42em 1.2em; flex:1 1 auto; max-width:72vw }
    #sleepTag { font-size:.72rem }
    #hints { display:none }
    #panel { width:min(320px,92vw) }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",

<body>
<canvas id="c"></canvas>
<svg id="nebLabels"></svg>

<div id="top">
  <span id="brand">星海电台</span>
  <span class="sp"></span>
  <button id="viewBtn" title="切换视图 (V)">🌐 地球</button>
  <button id="panelBtn" title="收藏 / 历史 / 睡眠">☰</button>
</div>

<div id="filters">
  <select id="fGenre">
    <option value="">流派 全部</option>
    <option value="pop">流行</option><option value="rock">摇滚</option>
    <option value="dance">电子</option><option value="jazz">爵士</option>
    <option value="classical">古典</option><option value="news">新闻谈话</option>
    <option value="hip hop">嘻哈</option><option value="country">乡村</option>

  </select>

<div id="ui">

  <div id="acts">

<div id="diveBar">
  <button class="btn" id="dvBack">← 返回 · Esc</button>
  <button class="btn" id="dvPrev">‹</button><span id="dvMode" style="font-size:.8rem;color:var(--dim);min-width:4.5em;text-align:center">黑胶盘</span><button class="btn" id="dvNext">›</button>
  <button class="btn" id="dvUp" title="上一台 (↑)">‹ 台</button>
  <button class="btn" id="dvDown" title="下一台 (↓)">台 ›</button>

  <button id="panelClose">✕</button>
  <h3>收藏</h3>
  <div class="row">只听收藏<span class="sp"></span><div class="sw" id="onlySavedSw"></div></div>
  <div class="chips" id="likeChips"></div>
  <p class="empty" id="likeEmpty">还没有收藏。喜欢的台点 ♡ 或按 F。</p>

<div id="search">
  <div id="searchBox">
    <input id="searchInput" placeholder="搜电台、城市或国家…" autocomplete="off">
    <div id="searchList"></div>
  </div>
</div>

<div id="hints">
  <b>/</b> 搜索 · <b>空格</b> 播停 · <b>N</b> 下一站<br>
  <b>F</b> 收藏 · <b>V</b> 换视图 · <b>↵</b> 唱片 · <b>Esc</b> 关闭
</div>

<p id="credit"><a href="https://www.radio-browser.info" target="_blank" rel="noopener">电台目录 Radio Browser</a></p>

<script type="module">
import * as THREE from 'three';
import { feature } from 'topojson-client';

const RB_HOSTS = ['de1', 'de2', 'all'];        // 镜像链,超时 12s 换下一个
async function rbFetch(path) {
  let err = null;
  for (const h of RB_HOSTS) {
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(`https://${h}.api.radio-browser.info${path}`, { signal:ctrl.signal });
      clearTimeout(tm);
      if (r.ok) return r.json();
      err = Error(`HTTP ${r.status} @${h}`);
    } catch (e) { clearTimeout(tm); err = e; }
  }
  throw err;
}
const $ = id => document.getElementById(id);
const nameEl = $('name'), metaEl = $('meta');
const player = new Audio();
const aux = new Audio(); aux.preload = 'auto';   // 预缓冲下一台

/* ============ 流派(星云簇/着色) ============ */
const GENRES = [
  { tag:'pop',        zh:'流行',  c:0xff7a90 },
  { tag:'rock',       zh:'摇滚',  c:0xff9a5a },
  { tag:'dance',      zh:'电子',  c:0x7ad0ff },
  { tag:'jazz',       zh:'爵士',  c:0xffd07a },
  { tag:'classical',  zh:'古典',  c:0xc09aff },
  { tag:'news',       zh:'新闻',  c:0x9ab8a0 },
  { tag:'hip hop',    zh:'嘻哈',  c:0x8affc0 },
  { tag:'country',    zh:'乡村',  c:0xd0a06a },
  { tag:'folk',       zh:'民谣',  c:0xa0d8a0 },
  { tag:'religious',  zh:'宗教',  c:0xffffff },
];
function genreIdx(tags) {
  const t = (tags || '').toLowerCase();
  for (let i = 0; i < GENRES.length; i++) if (t.includes(GENRES[i].tag)) return i;
  if (/talk|news|资讯|新闻/.test(t)) return 5;
  return -1;                                  // 综合未分类
}
const genreColor = i => i < 0 ? 0x8899aa : GENRES[i].c;

/* ============ three 基础 ============ */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
camera.position.set(0, 0, 6);
const globe = new THREE.Group();               // 地球视图容器
const nebula = new THREE.Group();              // 星云视图容器
scene.add(globe, nebula);
nebula.visible = false;

const dotTex = (() => {                        // 圆点贴图
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#fffa'); g.addColorStop(1, '#fff0');
  x.fillStyle = g; x.beginPath(); x.arc(16, 16, 16, 0, 7); x.fill();
  return new THREE.CanvasTexture(c);
})();

{ /* 背景星点 */
  const n = 2000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(40 + Math.random() * 60);
    pos.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color:0x8fa8c8, size:0.09, sizeAttenuation:true, map:dotTex,
    transparent:true, opacity:0.75, depthWrite:false })));
}

/* --- 地球 --- */
function ll2v(lat, lon, r) {
  const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th),
                            r * Math.cos(phi),
                            r * Math.sin(phi) * Math.sin(th));
}
globe.add(new THREE.Mesh(new THREE.SphereGeometry(1.99, 48, 32),
                         new THREE.MeshBasicMaterial({ color:0x060a12 })));
{ /* 经纬网格 */
  const mat = new THREE.LineBasicMaterial({ color:0x1c3a5e, transparent:true, opacity:0.85 });
  const seg = 96;
  const ring = pts => globe.add(new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts), mat));
  for (let lat = -75; lat <= 75; lat += 15)
    ring(Array.from({length:seg}, (_, i) => ll2v(lat, i / seg * 360 - 180, 2)));
  for (let lon = -180; lon < 180; lon += 15)
    ring(Array.from({length:seg}, (_, i) => ll2v(i / seg * 180 - 90, lon, 2)));
}
{ /* 大陆轮廓(world-atlas 110m,双 CDN 兜底) */
  const urls = ['https://unpkg.com/world-atlas@2.0.2/land-110m.json',
                'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json'];
  (async () => {
    let topo = null;
    for (const u of urls) { try { topo = await (await fetch(u)).json(); break; } catch {} }
    if (!topo) return;
    const land = feature(topo, topo.objects.land);
    const mat = new THREE.LineBasicMaterial({ color:0x3f7d9e, transparent:true, opacity:0.95 });
    const polys = land.type === 'FeatureCollection'
      ? land.features.flatMap(f => f.geometry.coordinates) : land.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) {
      if (ring.length < 4) continue;
      globe.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
        ring.map(([lon, lat]) => ll2v(lat, lon, 2))), mat));
    }
  })();
}

/* --- 电台点(地球 + 星云两份 buffer,同一数据) --- */
const CAP = 5000;
let stations = [];                             // {s, gpos(球面), npos(星云), col}
function makePoints(group, size) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(CAP * 3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(CAP * 3), 3));
  const p = new THREE.Points(geo, new THREE.PointsMaterial({
    size, sizeAttenuation:true, map:dotTex, vertexColors:true,
    transparent:true, opacity:0.95, depthWrite:false }));
  group.add(p);
  return p;
}
const gDots = makePoints(globe, 0.06);
const nDots = makePoints(nebula, 0.09);
const pulse = new THREE.Points(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 2)]),
  new THREE.PointsMaterial({ color:0xffe3bd, size:0.16, sizeAttenuation:true, map:dotTex,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
globe.add(pulse);

const _c = new THREE.Color();
let nebCtrs = [], nebCnt = [];                  // 簇心/台数(fillDots 更新,标签层共用)
function fillDots() {
  /* 流派计数 → 簇心(台数占比定簇半径,仿 roamdial) */
  nebCnt = new Array(GENRES.length + 1).fill(0);
  stations.forEach(t => nebCnt[genreIdx(t.s.tags) + 1]++);
  const a = nebCnt.length, mx = Math.max(...nebCnt, 1);
  nebCtrs = nebCnt.map((n, e) => {
    const t = e / a * Math.PI * 2 + 0.3, R = 3 + (e % 2) * 0.9;   // 双环交错
    return { x: Math.cos(t) * R, y: Math.sin(e * 1.9) * 0.7, z: Math.sin(t) * R,
             r: 0.35 + 0.95 * Math.sqrt(n / mx) };
  });
  glowMesh.geometry.attributes.position.array.set(
    nebCtrs.flatMap(c => [c.x, c.y, c.z]));
  glowMesh.geometry.attributes.position.needsUpdate = true;
  const gc = glowMesh.geometry.attributes.color.array;
  nebCtrs.forEach((c, e) => {
    _c.setHex(genreColor(e - 1)).multiplyScalar(0.5);
    gc.set([_c.r, _c.g, _c.b], e * 3);
  });
  glowMesh.geometry.attributes.color.needsUpdate = true;
  stations.forEach((t, i) => { t.npos = nebulaPos(genreIdx(t.s.tags), i); });
  for (const [pts, key] of [[gDots, 'gpos'], [nDots, 'npos']]) {
    const pa = pts.geometry.attributes.position.array;
    const ca = pts.geometry.attributes.color.array;
    stations.forEach((t, i) => {
      pa.set([t[key].x, t[key].y, t[key].z], i * 3);
      _c.setHex(genreColor(genreIdx(t.s.tags)));
      ca.set([_c.r, _c.g, _c.b], i * 3);
    });
    pts.geometry.setDrawRange(0, stations.length);
    pts.geometry.attributes.position.needsUpdate = true;
    pts.geometry.attributes.color.needsUpdate = true;
    pts.geometry.boundingSphere = null;
  }
}

/* 星云位置(roamdial 同款):簇内黄金角螺旋盘面,y 压扁 ×0.45,高斯抖动 ±0.3r */
function nebulaPos(gi, seed) {
  const c = nebCtrs[gi < 0 ? nebCtrs.length - 1 : gi];
  const k = (seed + 1) * 12.9898;               // 确定性伪随机,重转不跳变
  const rnd = f => { const x = Math.sin(k + f * 78.233) * 43758.5453; return x - Math.floor(x); };
  const g = () => (rnd(Math.floor(rnd(9) * 1e3) % 7 + 1) + rnd(3) - 1);   // 近高斯
  const o = rnd(1) * 2 - 1, l = Math.sqrt(Math.max(0, 1 - o * o));
  const u = seed * Math.PI * (3 - Math.sqrt(5)) * 3.1;
  const d = c.r * 0.62;
  return new THREE.Vector3(
    c.x + Math.cos(u) * l * d + g() * c.r * 0.3,
    c.y + o * d * 0.45 + g() * c.r * 0.16,
    c.z + Math.sin(u) * l * d + g() * c.r * 0.3);
}
const glowMesh = new THREE.Points(
  (() => { const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((GENRES.length + 1) * 3), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array((GENRES.length + 1) * 3), 3));
    return g; })(),
  new THREE.PointsMaterial({ size:1.1, sizeAttenuation:true, map:dotTex, vertexColors:true,
    transparent:true, opacity:0.16, blending:THREE.AdditiveBlending, depthWrite:false }));
nebula.add(glowMesh);

/* ============ 中国省份归位 + 国家散布 ============ */
const CN_GEO = [
  ['黑龙江', ['heilungkiang','heilongjiang'], 45.8, 126.6],
  ['内蒙古', ['inner mongolia','neimenggu'],   40.8, 111.7],
  ['浙江',   ['chekiang','zhejiang'],          30.3, 120.2],
  ['吉林',   ['kirin','jilin'],                43.9, 125.3],
  ['辽宁',   ['liaoning','fengtien'],          41.8, 123.4],
  ['江苏',   ['kiangsu','jiangsu'],            32.1, 118.8],
  ['安徽',   ['anhwei','anhui'],               31.8, 117.3],

function cnPlace(s) {

  AR:[-56,-21,-74,-53], CN:[18,54,73,135], JP:[30,46,128,146], KR:[33,39,126,130],

function geoPlausible(cc, lat, lon) {

}
function placeLatLon(s, byCC) {               // 无坐标台的安放

  if (cn) return [cn[0] + Math.random() - 0.5, cn[1] + Math.random() - 0.5];
  const arr = byCC[s.countrycode];
  if (arr) {
    const [rl, ro] = arr[(Math.random() * arr.length) | 0];

const CACHE = { pool:'rdx_pool', langs:'rdx_langs' };   // ponytail: 单槽缓存,只存最近一次查询;多查询分槽等真需要再加
const cacheGet = (k, maxAge) => {
  try { const c = JSON.parse(localStorage.getItem(k));
        if (c && Date.now() - c.t < maxAge) return c; } catch {}

};
const slimApi = s => ({ stationuuid:s.stationuuid, name:s.name, url_resolved:s.url_resolved,
  country:s.country, countrycode:s.countrycode, state:s.state, bitrate:s.bitrate,
  tags:s.tags, geo_lat:s.geo_lat, geo_long:s.geo_long });
function buildPool(list) {                    // 原始数组 → 电台池(真坐标 + 散布)
  const byCC = {}, placed = new Set();
  stations = [];
  for (const s of list) {
    const ok = isFinite(+s.geo_lat) && isFinite(+s.geo_long)
            && !(+s.geo_lat === 0 && +s.geo_long === 0)    // (0,0)=未标注
            && geoPlausible(s.countrycode, +s.geo_lat, +s.geo_long);  // 错标过滤
    if (ok) {
      stations.push(mkT(s));
      placed.add(s.stationuuid);
      (byCC[s.countrycode] ||= []).push([+s.geo_lat, +s.geo_long]);
    }
  }
  for (const s of list) {
    if (stations.length >= CAP) break;
    if (placed.has(s.stationuuid)) continue;   // 已按真坐标入池,别再散布一份
    const p = placeLatLon(s, byCC);
    if (!p) continue;
    stations.push(mkT(s, p));
  }

  buildCountryOptions();
  armStandby();
}
function altFiltered() {                       // 快照按当前筛选客户端过滤 + 抽样
  let list = rdPool.filter(t =>
    (!fLang.value || t.rdLang === fLang.value) &&
    (!fCountry.value || t.countrycode === fCountry.value) &&
    (!fGenre.value || t.tags.toLowerCase().includes(fGenre.value)) &&
    (!(+fBitrate.value) || t.bitrate >= +fBitrate.value));
  if (list.length > CAP)                       // 全量超出 buffer 上限时按比例抽样
    list = list.filter(() => Math.random() < CAP / list.length);

}
async function loadStations() {                // 三级:缓存 → 快照秒开 → API 后台换新
  const q = apiURL();
  const c = cacheGet(CACHE.pool, 7 * 864e5);
  if (c && c.q === q) {
    buildPool(c.s);                            // 一档:7 天内本地缓存
  } else {
    try {                                      // 二档:仓库快照,首次访问也秒开
      await loadRoamdial();
      buildPool(altFiltered());
      fromAlt = true;
    } catch { await refreshFromAPI(q, c); return; }   // 快照也没有:只能等 API
  }

}
async function refreshFromAPI(q, c) {
  try {
    const list = (await rbFetch(q))
      .filter(s => s.url_resolved && s.url_resolved.startsWith('https'));   // 混合内容拦截
    fromCache = false; fromAlt = false;
    buildPool(list);
    try { localStorage.setItem(CACHE.pool,
      JSON.stringify({ q, t: Date.now(), s: list.slice(0, 3000).map(slimApi) })); } catch {}
  } catch (e) {
    if (stations.length) {                     // 已有秒开数据:标来源,不报错
      if (c && c.q === q) fromCache = true;

    }

}

let current = null, flyQ = null, fromCache = false, fromAlt = false;

const _lv = new THREE.Vector3();
function ll2lon(v) {                          // 球面坐标 → 经度(散布台用落点算时区)

  return Math.atan2(_lv.z, -_lv.x) * 180 / Math.PI - 180;
}
function localTime(lon) {                     // ponytail: 经度估算时区(±30 分钟误差),精确需 GeoNames 后端
  const off = Math.round((lon || 0) / 15);

}

  document.title = `${s.name} - 星海电台`;
  likeBtn.textContent = getLikes().some(x => x.stationuuid === s.stationuuid) ? '♥' : '♡';
  likeBtn.classList.toggle('on', likeBtn.textContent === '♥');
  lsSet(LS.last, s.stationuuid);
}
function playStation(t) {
  current = t;
  if (stations.length < CAP && !stations.some(x => x.s.stationuuid === t.s.stationuuid)) { stations.push(t); fillDots(); }
  describe(t); pushHist(t); fxStatic();
  pulse.geometry.setFromPoints([t.gpos]);
  if (!view)                                  // 地球视图:飞到该台
    flyQ = new THREE.Quaternion().setFromUnitVectors(
      t.gpos.clone().normalize(), new THREE.Vector3(0, 0, 1));

  player.play().catch(() => {});

let standby = null;
const pool = () => onlySaved
  ? getLikes().map(s => mkT(s, placeLatLon(s, poolByCC()) || [+s.geo_lat, +s.geo_long]))
  : stations;
function armStandby() {
  const p = pool();
  if (!p.length || navigator.connection?.saveData) return;   // 省流量模式不预载
  standby = p[(Math.random() * p.length) | 0];

}
function next() {
  const p = pool();
  if (!p.length) { nameEl.textContent = onlySaved ? '收藏是空的' : '没有可用电台'; return; }
  playStation(standby && p.includes(standby) ? standby : p[(Math.random() * p.length) | 0]);
}
let failN = 0;                                 // 连续死链计数,防全网失效时无限换台
player.onerror = () => {
  if (++failN > 10) { nameEl.textContent = '没有可用流,稍后再试'; metaEl.textContent = ''; failN = 0; return; }
  if (current) {                               // 拨盘/选台语义:死链先换同国家台,不甩去随机国家
    const same = stations.filter(t => t !== current && t.s.countrycode === current.s.countrycode);
    if (same.length) { playStation(same[(Math.random() * same.length) | 0]); return; }
  }

/* ============ 调台杂音(独立 AudioContext,不碰播放链路) ============ */
let fxCtx = null;
function fxStatic() {
  try {
    fxCtx ||= new AudioContext();
    if (fxCtx.state === 'suspended') fxCtx.resume();
    const len = 0.18 * fxCtx.sampleRate;
    const buf = fxCtx.createBuffer(1, len, fxCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = fxCtx.createBufferSource(); src.buffer = buf;
    const bp = fxCtx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1600 + Math.random() * 800; bp.Q.value = 0.6;
    const g = fxCtx.createGain(); g.gain.value = 0.12;
    src.connect(bp).connect(g).connect(fxCtx.destination);
    src.start();
  } catch {}
}

/* ============ 搜索 ============ */
const searchEl = $('search'), searchInput = $('searchInput'), searchList = $('searchList');
function openSearch() { searchEl.classList.add('open'); searchInput.value = ''; runSearch(); searchInput.focus(); }
function closeSearch() { searchEl.classList.remove('open'); }
function runSearch() {
  const q = searchInput.value.trim().toLowerCase();
  const p = pool();
  const hits = (q ? p.filter(t =>
    (t.s.name + ' ' + (t.s.country || '') + ' ' + (t.s.state || '') + ' ' + (t.s.tags || ''))
    .toLowerCase().includes(q)) : p).slice(0, 40);
  searchList.innerHTML = '';
  hits.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.s.name;                 // 台名是社区数据,只用 textContent
    const sp = document.createElement('span');
    sp.className = 's';
    sp.textContent = `${t.s.country || ''} · ${(t.s.tags || '').split(',')[0] || ''}`;
    b.appendChild(document.createElement('br'), sp);
    b.appendChild(sp);
    b.onclick = () => { closeSearch(); playStation(t); };
    searchList.appendChild(b);
  });
  if (!hits.length) searchList.innerHTML = '<button disabled><span class="s">没有找到,换个关键词</span></button>';
}
searchInput.addEventListener('input', runSearch);
searchEl.addEventListener('click', e => { if (e.target === searchEl) closeSearch(); });

/* ============ 视图切换:0 地球 / 1 星云 ============ */
let view = 0;
function setView(v) {
  if (dive) { scene.remove(dive.group); dive = null; }   // 唱片让位视图切换
  view = v;
  globe.visible = !v; nebula.visible = !!v;
  pulse.visible = !v;
  $('viewBtn').textContent = v ? '🌌 星云' : '🌐 地球';
  if (v) camDist = Math.max(camDist, 8.5);      // 簇环半径 3.9+抖动,拉远才全入画
  else camDist = Math.min(camDist, 6);          // 回地球:还原距离
  if (!v && current)                            // 回地球视图:飞回当前台
    flyQ = new THREE.Quaternion().setFromUnitVectors(
      current.gpos.clone().normalize(), new THREE.Vector3(0, 0, 1));
}

/* ============ 唱片视图(roamdial 式:进入按钮 + 多形态 + 邻近台导航) ============ */
let dive = null;                              // {group, pts, list, mode}
let discMode = 0;                             // 0 黑胶盘 1 频谱山脉 2 星球环
const DISC_NAMES = ['黑胶盘', '频谱山脉', '星球环'];
function enterDive(anchor) {
  if (dive || !anchor) return;
  const dir = anchor.gpos.clone().normalize();          // 邻域按锚点方向收
  const list = stations.filter(t => t !== anchor &&
    t.gpos.clone().normalize().dot(dir) > 0.86);
  list.unshift(anchor);
  const top = list.slice(0, 700);             // shortcut: 700 上限与 roamdial 相同,再多挤成一团
  if (top.length < 4) return;
  const pos = new Float32Array(top.length * 3), col = new Float32Array(top.length * 3);
  const ga = Math.PI * (3 - Math.sqrt(5));
  top.forEach((t, i) => {
    let x, y, z;
    if (discMode === 0) {                     // 黑胶盘:黄金角唱纹(r 随序号开方)
      const l = 1.25 / Math.sqrt(top.length);
      const r = l * Math.sqrt(i + .6), a = i * ga;
      x = Math.cos(a) * r; y = Math.sin(a) * r; z = 0;
    } else if (discMode === 1) {              // 频谱山脉:x 均布、y=码率+波状起伏、z 分行
      x = (i % 60 - 29.5) * 0.075;
      z = -Math.floor(i / 60) * 0.075;
      y = ((t.s.bitrate || 96) / 320) * 1.1 - 0.55
        + Math.sin(i * 0.37) * 0.28 + Math.sin(i * 0.11) * 0.35
        + Math.random() * 0.18;
    } else {                                  // 星球环:大半径缓变螺旋
      const a = i * 0.35, r = 0.5 + (i / top.length) * 1.9 + Math.sin(i * 0.05) * 0.25;
      x = Math.cos(a) * r; z = Math.sin(a) * r * 0.35;
      y = Math.sin(a * 2.3) * 0.4;
    }
    pos.set([x, y, z], i * 3);
    const c3 = new THREE.Color(genreColor(genreIdx(t.s.tags)));
    col.set([c3.r, c3.g, c3.b], i * 3);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size:0.055, sizeAttenuation:true, map:dotTex, vertexColors:true,
    transparent:true, opacity:0.95, depthWrite:false }));
  const g = new THREE.Group(); g.position.z = 2.55; g.add(pts); scene.add(g);
  globe.visible = nebula.visible = pulse.visible = false;
  camDist = 6.2;
  dive = { group: g, pts, list: top, mode: discMode };
  $('diveBar').classList.add('open');
  $('dvMode').textContent = DISC_NAMES[discMode];
}
function exitDive() {
  if (!dive) return;
  scene.remove(dive.group);
  dive = null;
  $('diveBar').classList.remove('open');
  setView(view);                              // 恢复原视图(距离/可见性一并还原)
}
function cycleDisc(d) {                       // 换形态:重建唱片
  if (!dive) return;
  const anchor = dive.list[0];
  discMode = (discMode + d + DISC_NAMES.length) % DISC_NAMES.length;
  exitDive(); enterDive(anchor);
}
function diveStep(dir) {                      // 唱片内沿列表换台(上下箭头)
  if (!dive || !current) return;
  const i = dive.list.indexOf(current);
  const t = dive.list[(i + dir + dive.list.length) % dive.list.length];
  playStation(t);
}

/* ============ 交互:拖拽/缩放/点击 ============ */
const drag = { on:false, x:0, y:0, moved:0 };
const vel = { x:0, y:0 };
const ptrs = new Map();
let pinchD = 0, camDist = 6;
const clampCam = () => { camDist = Math.min(16, Math.max(3, camDist)); };
const _q = new THREE.Quaternion();
function rotateBy(dx, dy) {
  const k = 0.004 * camDist / 6;
  const grp = view ? nebula : globe;          // 星云与地球同款自由旋转(X+Y)
  _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
  grp.quaternion.premultiply(_q);
  _q.setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
  grp.quaternion.premultiply(_q);
}
canvas.addEventListener('wheel', e => {
  e.preventDefault(); wake();
  camDist *= 1 + e.deltaY * 0.0012; clampCam();
}, { passive:false });
canvas.addEventListener('pointerdown', e => {
  wake(); dialArm = false;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  if (ptrs.size === 2) {
    drag.on = false; vel.x = vel.y = 0;
    const [a, b] = [...ptrs.values()];
    pinchD = Math.hypot(a.x - b.x, a.y - b.y);
  } else {
    drag.on = true; drag.moved = 0; drag.x = e.clientX; drag.y = e.clientY;
    vel.x = vel.y = 0; flyQ = null;
  }
});
canvas.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0 && d > 0) { camDist *= pinchD / d; clampCam(); }
    pinchD = d;
    return;
  }
  if (!drag.on) { hoverAt(e); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  vel.x = dx * 0.004; vel.y = dy * 0.004;
  rotateBy(dx * 0.004, dy * 0.004);
});
addEventListener('pointerup', e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchD = 0;
  if (!drag.on) return;
  drag.on = false;
  if (drag.moved < 8) pick(e);
  else { dialArm = true; settleAt = performance.now() + 700; }   // 旋转松手:停稳后播中心台
});
addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinchD = 0; drag.on = false; });

const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.07;
const _fc = new THREE.Vector3();
function frontCheck(t) {                      // 复用向量,别在热路径 clone
  return view ? true : _fc.copy(t.gpos).applyQuaternion(globe.quaternion).z > 0.1;
}
function pick(e) {
  const m = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(m, camera);
  if (dive) {                                  // 唱片上:点台换曲;点空处退出
    const h = raycaster.intersectObject(dive.pts)[0];
    if (h) { playStation(dive.list[h.index]); return; }
    exitDive(); return;
  }
  const pts = view ? nDots : gDots;
  for (const h of raycaster.intersectObject(pts)) {
    const t = stations[h.index];
    if (t && frontCheck(t)) { playStation(t); return; }   // 点击只播,进唱片走 💿/Enter
  }
}
function hoverAt(e) {
  if (dive) return;
  const m = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(m, camera);
  canvas.style.cursor = raycaster.intersectObject(view ? nDots : gDots).length ? 'pointer' : 'grab';
}

/* ============ 闲置计时(唱片内点击换台,退出走 ESC/点空白/切视图) ============ */
let lastAct = performance.now();
function wake() {
  lastAct = performance.now();
}

/* ============ 渲染循环 ============ */
let raf = 0, lastT = performance.now(), idleAt = performance.now();
function frame(t) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
  if (t - lastAct > 30000 && !dive && current) enterDive(current);
  if (dive) {                                  // 盘/环绕轴缓转,山脉静观(roamdial 形态各异)
    if (dive.mode !== 1) {
      _q.setFromAxisAngle(_zAxis, dt * 0.15);
      dive.group.quaternion.premultiply(_q);
    }
  } else if (flyQ) {
    globe.quaternion.slerp(flyQ, 1 - Math.pow(0.002, dt));
    if (globe.quaternion.angleTo(flyQ) < 0.01) { flyQ = null; idleAt = t; }
  } else if (!drag.on) {
    if (Math.abs(vel.x) + Math.abs(vel.y) > 1e-4) {
      rotateBy(vel.x, vel.y);
      const k = Math.pow(0.05, dt); vel.x *= k; vel.y *= k;
    } else if (t - idleAt > 3000)
      rotateBy(dt * 0.05, 0);
  }
  pulse.material.size = 0.13 + 0.05 * Math.sin(t / 180);
  camera.position.z = camDist;
  renderer.render(scene, camera);
  drawLabels(t);
  if (dialArm && !onlySaved && !drag.on && !flyQ && t > settleAt &&   // 拨盘:转完停稳,播准星台(地球/星云通用;"只听收藏"时旁路)
      centerHit && centerHit !== current) { dialArm = false; playStation(centerHit); }
}
let dialArm = false, settleAt = 0;
const _zAxis = new THREE.Vector3(0, 0, 1);

/* ============ 标签层:星云流派名 / 地球中心追踪(20fps 足够,省 innerHTML 开销) */
const nebSvg = $('nebLabels');
const _pv = new THREE.Vector3();
let lblAcc = 0, centerHit = null;               // centerHit:准星当前压中的台,转动停稳后自动播它
const esc = s => String(s).replace(/[&<>]/g,   // 台名/国家是社区数据,插值前必须转义(文本内容位置,&<> 足够;" 推送通道会吃)
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function drawLabels(t) {
  lblAcc += 1;
  if (lblAcc < 3) return;                       // 每 3 帧一刷(≈20fps)
  lblAcc = 0;
  let html = '';
  if (dive || !stations.length) { centerHit = null; nebSvg.innerHTML = html; return; }
  if (view) {                                   // 星云:簇心上方投影流派名 + 台数
    nebula.updateMatrixWorld();
    nebCtrs.forEach((c, e) => {
      if (!nebCnt[e]) return;
      _pv.set(c.x, c.y + c.r * 0.9 + 0.15, c.z).applyMatrix4(nebula.matrixWorld).project(camera);
      if (_pv.z > 1) return;                    // 背面/出屏剔除
      const x = (_pv.x * .5 + .5) * innerWidth, y = (-_pv.y * .5 + .5) * innerHeight;
      const col = '#' + _c.setHex(genreColor(e - 1)).getHexString();
      const nm = e - 1 < 0 ? '综合' : GENRES[e - 1].zh;
      html += `<text class="big" x="${x.toFixed(0)}" y="${y.toFixed(0)}" text-anchor="middle" fill="${col}">${nm}</text>` +
              `<text class="s" x="${x.toFixed(0)}" y="${(y + 15).toFixed(0)}" text-anchor="middle">${nebCnt[e]} 台</text>`;
    });
  }
  { /* 准星中心台(两视图同公式:与视线夹角最小者,12° 内才算压中) */
    const grp = view ? nebula : globe;
    let hit = null, best = 0.978;               // cos12°
    for (const st of stations) {
      const p = _fc.copy(view ? st.npos : st.gpos).applyQuaternion(grp.quaternion);
      const z = p.z / p.length();               // 归一化:npos 各点半径不同
      if (z > best) { best = z; hit = st; }
    }
    centerHit = hit;
    if (hit) {
      const cx = innerWidth / 2, cy = innerHeight / 2;
      html += `<circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#8ba0b8" stroke-opacity=".5"/>` +
              `<line x1="${cx + 13}" y1="${cy - 13}" x2="${cx + 26}" y2="${cy - 26}" stroke="#8ba0b8" stroke-opacity=".5"/>` +
              `<text class="big" x="${cx + 30}" y="${cy - 28}" fill="#dde7f2">${esc(hit.s.name.slice(0, 30))}</text>` +
              `<text class="s" x="${cx + 30}" y="${cy - 13}">${esc(hit.s.country)} · ${esc((hit.s.tags || '').split(',')[0])}</text>`;
    }
  }
  nebSvg.innerHTML = html;
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else { lastT = performance.now(); raf = requestAnimationFrame(frame); }
});
resize(); raf = requestAnimationFrame(frame);

/* ============ UI 接线 ============ */
$('nextBtn').onclick = () => { wake(); next(); };
$('ppBtn').onclick = () => { wake(); player.paused ? player.play().catch(() => {}) : player.pause(); };
likeBtn.onclick = () => { wake(); toggleLike(); };
$('shBtn').onclick = () => {
  if (!current) return;
  const url = (location.origin.startsWith('http') ? location.origin + location.pathname
                                                  : location.href.split('?')[0]) + '?s=' + current.s.stationuuid;
  navigator.clipboard?.writeText(url).catch?.(() => {});
  $('shBtn').textContent = '✓'; setTimeout(() => $('shBtn').textContent = '🔗', 1200);
};
$('searchBtn').onclick = openSearch;
$('diveBtn').onclick = () => { wake(); if (dive) exitDive(); else enterDive(current); };
$('dvBack').onclick = () => { wake(); exitDive(); };
$('dvPrev').onclick = () => cycleDisc(-1);
$('dvNext').onclick = () => cycleDisc(1);
$('dvUp').onclick = () => diveStep(-1);
$('dvDown').onclick = () => diveStep(1);
$('viewBtn').onclick = () => { wake(); setView(view ? 0 : 1); };
$('panelBtn').onclick = () => { $('panel').classList.add('open'); renderPanel(); renderSleep(); };
$('panelClose').onclick = () => $('panel').classList.remove('open');
$('onlySavedSw').onclick = () => {
  onlySaved = !onlySaved; lsSet(LS.only, onlySaved);
  renderPanel(); armStandby();
};
for (const sel of [fGenre, fLang, fCountry, fBitrate])
  sel.addEventListener('change', async () => {
    nameEl.textContent = 'Loading…'; metaEl.textContent = '';
    await loadStations().catch(() => {});
    next();
  });
addEventListener('keydown', e => {
  if (/INPUT|SELECT|BUTTON|TEXTAREA/.test(e.target.tagName))   // 焦点在控件上:空格/字符留给原生行为
    { if (e.key === 'Escape') closeSearch(); return; }
  const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); openSearch(); }
  else if (k === ' ') { e.preventDefault(); wake(); $('ppBtn').onclick(); }
  else if (k === 'n') { wake(); next(); }
  else if (k === 'f') { wake(); toggleLike(); }
  else if (k === 'v') { wake(); setView(view ? 0 : 1); }
  else if (k === 'd' || k === 'enter') { wake(); dive ? exitDive() : enterDive(current); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); diveStep(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); diveStep(-1); }
  else if (e.key === 'ArrowLeft' && dive) { e.preventDefault(); cycleDisc(-1); }
  else if (e.key === 'ArrowRight' && dive) { e.preventDefault(); cycleDisc(1); }
  else if (e.key === 'Escape') { closeSearch(); $('panel').classList.remove('open'); if (dive) exitDive(); }
});
addEventListener('pointerdown', () => { fxStatic(); player.play().catch(() => {}); }, { once:true });

/* ============ 启动:分享 > 上次 > 随机 ============ */
renderPanel(); renderSleep();
loadLanguages().catch(() => {});
(async () => {
  await loadStations().catch(() => {
    nameEl.textContent = '电台目录加载失败'; metaEl.textContent = 'Radio Browser 镜像暂不可用,稍后刷新';
  });
  const shareUUID = new URLSearchParams(location.search).get('s');
  const lastUUID = lsGet(LS.last, '');
  const localFind = u => u && stations.find(t => t.s.stationuuid === u);   // 快照台(rd-*)本地即中
  const t = localFind(shareUUID) || localFind(lastUUID)
         || (shareUUID ? await stationByUUID(shareUUID) : null)
         || (lastUUID ? await stationByUUID(lastUUID) : null)
         || null;
  if (t) playStation(t); else next();
})();
window.__dbg = { get stations() { return stations.length; }, get dive() { return !!dive; }, setView, enterDive, next, loadStations, loadRoamdial };
</script>
</body>
</html>
